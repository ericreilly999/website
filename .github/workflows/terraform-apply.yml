name: Terraform Apply

# Dispatch-only. The only way staging and production infrastructure changes.
# Applies the saved plan that Terraform Plan produced for THIS commit; it never
# re-plans, so what was reviewed in the plan summary is exactly what is applied.
#   gh workflow run terraform-apply.yml -f env=staging -f plan_run_id=<Terraform Plan run id>
#
# The `production` environment reviewer must approve before the job starts.
# Variables come from the GitHub environment (see terraform-plan.yml), plus
#   TF_APPLY_ROLE_ARN   apply role (OIDC trust: environment:<name>)
#
# The plan artifact holds the account-specific inputs baked into the saved
# plan, so apply does not need the TF_VAR_* values.

on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment root to apply
        required: true
        type: choice
        options:
          - staging
          - prod
      plan_run_id:
        description: Run id of the successful Terraform Plan run for this environment and this commit
        required: true
        type: string
      allow_destroy:
        description: Permit a plan that deletes or replaces resources (default refuses)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.11.4

jobs:
  apply:
    name: Apply ${{ inputs.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.env == 'prod' && 'production' || 'staging' }}
    concurrency:
      group: terraform-${{ inputs.env }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    defaults:
      run:
        working-directory: terraform/envs/${{ inputs.env }}
    steps:
      - name: Require main
        working-directory: .
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Dispatch from main (got $GITHUB_REF)"; exit 1
          fi

      - name: Verify the plan run
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::plan_run_id must be numeric"; exit 1
          fi
          read -r RUN_PATH SHA CONCLUSION < <(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
            --jq '[.path, .head_sha, .conclusion] | @tsv')
          if [ "$RUN_PATH" != ".github/workflows/terraform-plan.yml" ]; then
            echo "::error::Run $RUN_ID is not a Terraform Plan run ($RUN_PATH)"; exit 1
          fi
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::Plan run $RUN_ID did not succeed ($CONCLUSION)"; exit 1
          fi
          if [ "$SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Plan was made at $SHA; this dispatch is at $GITHUB_SHA. Re-plan."; exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require apply role configuration
        env:
          ROLE: ${{ vars.TF_APPLY_ROLE_ARN }}
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          for v in ROLE BUCKET REGION; do
            if [ -z "${!v}" ]; then
              echo "::error::Environment variable for $v is not set; this environment is not provisioned yet"; exit 1
            fi
          done

      - name: Download the saved plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tfplan-${{ inputs.env }}-${{ github.sha }}
          path: terraform/envs/${{ inputs.env }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.plan_run_id }}

      - name: Configure AWS credentials (OIDC, apply role)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          role-session-name: github-actions-website-tf-apply
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_REGION_VAR: ${{ vars.AWS_REGION }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION_VAR}"

      - name: Refuse destroy or replace unless allowed
        env:
          ALLOW_DESTROY: ${{ inputs.allow_destroy }}
        run: |
          DESTROY="$(terraform show -json tfplan | jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length')"
          echo "Destroy or replace actions in the plan: ${DESTROY}"
          if [ "$DESTROY" -gt 0 ] && [ "$ALLOW_DESTROY" != "true" ]; then
            echo "::error::Plan deletes or replaces ${DESTROY} resource(s); re-dispatch with allow_destroy=true if intended"; exit 1
          fi

      - name: Terraform apply (saved plan)
        run: terraform apply -input=false -lock-timeout=60s tfplan

      - name: Summarize outputs
        run: |
          {
            echo "## Terraform apply: ${{ inputs.env }} @ ${GITHUB_SHA}"
            echo "Plan run: ${{ inputs.plan_run_id }}"
            echo ""
            echo '```'
            terraform output -no-color 2>&1 | head -c 100000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
