name: Terraform Plan

# Dispatch-only, read-only. Plans terraform/envs/<env> and stores the saved plan
# as an artifact that Terraform Apply consumes for the same commit.
#   gh workflow run terraform-plan.yml -f env=staging
#
# The job runs in the GitHub environment (staging | production) so every
# account-specific value comes from environment variables, never from this file:
#   TF_PLAN_ROLE_ARN   read-only plan role (OIDC trust: environment:<name>)
#   AWS_REGION, TF_STATE_BUCKET
#   TF_VAR_AWS_ACCOUNT_ID, TF_VAR_DNS_ZONE_ID, TF_VAR_DNS_ACCOUNT_ID,
#   TF_VAR_DNS_ASSUME_ROLE_ARN (optional), TF_VAR_CONTACT_TO_EMAIL,
#   TF_VAR_CONTACT_FROM_EMAIL (prod)
# Note: planning production waits on the production environment reviewer, the
# same as applying it, because the environment owns the role variables.

on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment root to plan
        required: true
        type: choice
        options:
          - staging
          - prod

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.11.4

jobs:
  plan:
    name: Plan ${{ inputs.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.env == 'prod' && 'production' || 'staging' }}
    concurrency:
      group: terraform-${{ inputs.env }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform/envs/${{ inputs.env }}
    steps:
      - name: Require main
        working-directory: .
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Dispatch from main (got $GITHUB_REF)"; exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require plan role configuration
        env:
          ROLE: ${{ vars.TF_PLAN_ROLE_ARN }}
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          for v in ROLE BUCKET REGION; do
            if [ -z "${!v}" ]; then
              echo "::error::Environment variable for $v is not set; this environment is not provisioned yet"; exit 1
            fi
          done

      - name: Configure AWS credentials (OIDC, read-only plan role)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          role-session-name: github-actions-website-tf-plan
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Write account-specific inputs
        env:
          V_ACCOUNT: ${{ vars.TF_VAR_AWS_ACCOUNT_ID }}
          V_ZONE: ${{ vars.TF_VAR_DNS_ZONE_ID }}
          V_DNS_ACCOUNT: ${{ vars.TF_VAR_DNS_ACCOUNT_ID }}
          V_DNS_ROLE: ${{ vars.TF_VAR_DNS_ASSUME_ROLE_ARN }}
          V_TO: ${{ vars.TF_VAR_CONTACT_TO_EMAIL }}
          V_FROM: ${{ vars.TF_VAR_CONTACT_FROM_EMAIL }}
        run: |
          # Unset variables are omitted so the Terraform defaults (null) apply.
          jq -n \
            --arg a "$V_ACCOUNT" --arg z "$V_ZONE" --arg da "$V_DNS_ACCOUNT" \
            --arg dr "$V_DNS_ROLE" --arg to "$V_TO" --arg from "$V_FROM" \
            '{
              aws_account_id: $a, dns_zone_id: $z, dns_account_id: $da,
              dns_assume_role_arn: $dr, contact_to_email: $to, contact_from_email: $from
            } | with_entries(select(.value != ""))' \
            > ci.auto.tfvars.json

      - name: Terraform init
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_REGION_VAR: ${{ vars.AWS_REGION }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION_VAR}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -lock-timeout=60s -out=tfplan

      - name: Summarize plan
        run: |
          terraform show -json tfplan > tfplan.json
          DESTROY="$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' tfplan.json)"
          TOTAL="$(jq '[.resource_changes[]? | select(.change.actions != ["no-op"] and .change.actions != ["read"])] | length' tfplan.json)"
          {
            echo "## Terraform plan: ${{ inputs.env }} @ ${GITHUB_SHA}"
            echo ""
            echo "- Changed resources: ${TOTAL}"
            echo "- Destroy or replace: ${DESTROY}"
            echo ""
            echo '```'
            terraform show -no-color tfplan | head -c 900000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm tfplan.json ci.auto.tfvars.json

      - name: Upload plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tfplan-${{ inputs.env }}-${{ github.sha }}
          path: terraform/envs/${{ inputs.env }}/tfplan
          if-no-files-found: error
          retention-days: 7
