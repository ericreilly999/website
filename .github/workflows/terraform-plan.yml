name: Terraform Plan

# Dispatch-only, read-only. Plans terraform/envs/<env> and stores the saved plan
# as an artifact that Terraform Apply consumes for the same commit.
#   gh workflow run terraform-plan.yml -f env=staging
#
# The job runs in the GitHub environment (staging | production) so every
# account-specific value comes from the environment, never from this file.
# THIS REPOSITORY IS PUBLIC: run logs, job summaries and artifacts are readable
# by anyone, so nothing identifying may reach them.
#   Environment SECRETS (auto-masked in logs, including step headers; a plain
#   variable would be echoed in the step's env/with header before any mask runs):
#     TF_PLAN_ROLE_ARN   read-only plan role (OIDC trust: environment:<name>)
#     TF_STATE_BUCKET, TF_PLAN_ENCRYPTION_KEY (random 32+ char passphrase)
#     TF_VAR_AWS_ACCOUNT_ID, TF_VAR_DNS_ZONE_ID, TF_VAR_DNS_ACCOUNT_ID,
#     TF_VAR_DNS_ASSUME_ROLE_ARN (optional), TF_VAR_CONTACT_TO_EMAIL,
#     TF_VAR_CONTACT_FROM_EMAIL (prod)
#   Environment variable (non-identifying): AWS_REGION
# The saved plan embeds all of those values, so it is uploaded ONLY as an
# AES-256 encrypted file (key = TF_PLAN_ENCRYPTION_KEY), kept 1 day. The job
# summary lists resource addresses and actions only; the reviewer reads that.
# Note: planning production waits on the production environment reviewer, the
# same as applying it, because the environment owns the role variables.

on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment root to plan
        required: true
        type: choice
        options:
          - staging
          - prod

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.11.4

jobs:
  plan:
    name: Plan ${{ inputs.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.env == 'prod' && 'production' || 'staging' }}
    concurrency:
      group: terraform-${{ inputs.env }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform/envs/${{ inputs.env }}
    steps:
      - name: Require main
        working-directory: .
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Dispatch from main (got $GITHUB_REF)"; exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require plan role configuration
        env:
          ROLE: ${{ secrets.TF_PLAN_ROLE_ARN }}
          BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          REGION: ${{ vars.AWS_REGION }}
          PLAN_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
        run: |
          for v in ROLE BUCKET REGION PLAN_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Environment secret/variable for $v is not set; this environment is not provisioned yet"; exit 1
            fi
          done

      - name: Configure AWS credentials (OIDC, read-only plan role)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.TF_PLAN_ROLE_ARN }}
          role-session-name: github-actions-website-tf-plan
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Write account-specific inputs
        env:
          V_ACCOUNT: ${{ secrets.TF_VAR_AWS_ACCOUNT_ID }}
          V_ZONE: ${{ secrets.TF_VAR_DNS_ZONE_ID }}
          V_DNS_ACCOUNT: ${{ secrets.TF_VAR_DNS_ACCOUNT_ID }}
          V_DNS_ROLE: ${{ secrets.TF_VAR_DNS_ASSUME_ROLE_ARN }}
          V_TO: ${{ secrets.TF_VAR_CONTACT_TO_EMAIL }}
          V_FROM: ${{ secrets.TF_VAR_CONTACT_FROM_EMAIL }}
        run: |
          # Secrets are already masked; mask again as a belt-and-braces guard.
          for v in V_ACCOUNT V_ZONE V_DNS_ACCOUNT V_DNS_ROLE V_TO V_FROM; do
            if [ -n "${!v}" ]; then echo "::add-mask::${!v}"; fi
          done
          # Unset variables are omitted so the Terraform defaults (null) apply.
          jq -n \
            --arg a "$V_ACCOUNT" --arg z "$V_ZONE" --arg da "$V_DNS_ACCOUNT" \
            --arg dr "$V_DNS_ROLE" --arg to "$V_TO" --arg from "$V_FROM" \
            '{
              aws_account_id: $a, dns_zone_id: $z, dns_account_id: $da,
              dns_assume_role_arn: $dr, contact_to_email: $to, contact_from_email: $from
            } | with_entries(select(.value != ""))' \
            > ci.auto.tfvars.json

      - name: Terraform init
        env:
          STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_REGION_VAR: ${{ vars.AWS_REGION }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION_VAR}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        # Plan text goes to a file, never the public log (it prints attribute
        # values). A failure prints a scrubbed error excerpt only.
        run: |
          scrub() { sed -E 's#arn:aws[a-z-]*:[^ "]+#arn:***#g; s#[0-9]{12}#************#g; s#[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+#***@***#g; s#Z[A-Z0-9]{12,}#Z***#g; s#\[id=[^]]*\]##g'; }
          if ! terraform plan -input=false -lock-timeout=60s -no-color -out=tfplan > plan.log 2>&1; then
            echo "::error::terraform plan failed (scrubbed excerpt below; re-run locally for detail)"
            grep -E '^(Error|.? ?Error)' plan.log | scrub | head -n 20 || true
            rm -f plan.log ci.auto.tfvars.json
            exit 1
          fi
          rm -f plan.log

      - name: Summarize plan (addresses and actions only)
        run: |
          scrub() { sed -E 's#arn:aws[a-z-]*:[^ "]+#arn:***#g; s#[0-9]{12}#************#g; s#[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+#***@***#g; s#Z[A-Z0-9]{12,}#Z***#g; s#\[id=[^]]*\]##g'; }
          terraform show -json tfplan > tfplan.json
          DESTROY="$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' tfplan.json)"
          TOTAL="$(jq '[.resource_changes[]? | select(.change.actions != ["no-op"] and .change.actions != ["read"])] | length' tfplan.json)"
          {
            echo "## Terraform plan: ${{ inputs.env }} @ ${GITHUB_SHA}"
            echo ""
            echo "- Changed resources: ${TOTAL}"
            echo "- Destroy or replace: ${DESTROY}"
            echo ""
            echo "Resource addresses and actions only. Attribute values are deliberately not shown (public repo)."
            echo ""
            echo '```'
            jq -r '.resource_changes[]? | select(.change.actions != ["no-op"] and .change.actions != ["read"]) | "\(.change.actions | join("+"))\t\(.address)"' tfplan.json \
              | scrub | sort -k2 | head -n 500
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f tfplan.json ci.auto.tfvars.json

      - name: Encrypt plan
        env:
          PLAN_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in tfplan -out tfplan.enc -pass env:PLAN_KEY
          rm -f tfplan

      - name: Upload plan (encrypted)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tfplan-${{ inputs.env }}-${{ github.sha }}
          path: terraform/envs/${{ inputs.env }}/tfplan.enc
          if-no-files-found: error
          retention-days: 1
