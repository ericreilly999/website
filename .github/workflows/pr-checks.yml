name: PR Checks
# standards-waive: CI-01 WS-3

# Required status check on main's branch protection rule. The job name below
# ("PR Checks") is the exact string in required_status_checks.contexts: renaming
# the job deadlocks branch protection (the old context stays required and never
# reports again). Don't rename it without updating the protection rule in the
# same change.
#
# Deliberately no `paths:` filter: a path-filtered required check never reports on
# PRs that touch no listed path, and branch protection then waits forever.
# Scope is minimal: install + test. No AWS credentials, no build, no deploy.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20

jobs:
  pr-checks:
    name: PR Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Job summary
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "## PR checks complete"
            echo ""
            echo "- **PR:** #${PR_NUMBER}"
            echo "- **Head commit:** \`${HEAD_SHA}\`"
            echo "- **Scope:** dependency install + test suite (no build, no deploy)"
          } >> "$GITHUB_STEP_SUMMARY"
