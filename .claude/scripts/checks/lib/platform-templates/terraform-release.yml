# TEMPLATE (spec/pl1-fleet-agent-access.md v1.4.0, FA-FR-52): the caller of the central pipeline.
# Copied byte for byte to .github/workflows/terraform-release.yml of an adopting repo, except the one
# token __REPOSITORY__, which becomes <owner>/<repo>. Platform itself never commits this file (FA-FR-77).
#
# A release run starts when a session pushes a release-request branch (FA-FR-72). The one job calls
# the reusable workflow at @main: the OIDC claim job_workflow_ref then names main's
# terraform-pipeline.yml, and that is the only claim the pipeline roles trust (FA-FR-50, FA-FR-76).
# This file has no `with:`, no `secrets:`, no step and no filter other than the three branch patterns.
name: terraform-release

on:
  push:
    branches:
      - release/dev/*
      - release/staging/*
      - release/prod/*

jobs:
  release:
    permissions:
      id-token: write
      contents: read
      actions: read
    concurrency:
      group: tf-${{ github.repository }}-release
      cancel-in-progress: false
    uses: __REPOSITORY__/.github/workflows/terraform-pipeline.yml@main
