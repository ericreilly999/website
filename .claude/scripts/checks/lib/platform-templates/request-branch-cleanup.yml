# PROPOSED, not yet a platform template (cloud-releases.md "Record and clean up"; relayed to platform 2026-10-25).
# The one job a release-request or dev-suite push may run without the gate: it deletes its own request branch through
# the job token, only while the branch still points at this run's commit. standards-check CI-01 recognises it by exact
# text (steps, env, if) and permissions. When platform's spec adopts a cleanup job, replace this file with platform's text.
name: request-branch-cleanup

on:
  workflow_call:

jobs:
  cleanup:
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Delete this request branch while it still points at this run's commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${GITHUB_REF#refs/heads/}"
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq .object.sha) || exit 0
          [ "$head" = "$GITHUB_SHA" ] || exit 0
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
